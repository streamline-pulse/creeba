<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creeba × Elysia</title>
    <style>
      :root {
        --bg: #0b0f14;
        --panel: #131a23;
        --panel-2: #1b242f;
        --border: #26313d;
        --text: #e6edf3;
        --muted: #8b98a5;
        --accent: #5eead4;
        --accent-2: #38bdf8;
        --mine: #123b45;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: grid;
        grid-template-columns: 260px 1fr;
        height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: hidden;
      }
      .brand { font-weight: 700; font-size: 18px; letter-spacing: 0.3px; }
      .brand span { color: var(--accent); }
      .card {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }
      .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #f87171; }
      .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
      input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 9px 11px;
        outline: none;
      }
      input:focus { border-color: var(--accent-2); }
      .peers { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
      .peer { display: flex; align-items: center; gap: 8px; font-size: 13px; }
      .peer .dot { background: var(--accent-2); }
      main { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      header { padding: 16px 22px; border-bottom: 1px solid var(--border); font-weight: 600; }
      header small { color: var(--muted); font-weight: 400; }
      #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 70%; padding: 9px 13px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border); }
      .msg.mine { align-self: flex-end; background: var(--mine); border-color: #1c5560; }
      .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
      .msg .body { white-space: pre-wrap; word-break: break-word; }
      form { display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); }
      button {
        background: var(--accent);
        color: #04211d;
        border: 0;
        border-radius: 8px;
        padding: 0 20px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <aside>
      <div class="brand">cree<span>ba</span> × elysia</div>

      <div class="card">
        <div class="label">P2P node (server)</div>
        <div class="status"><span id="dot" class="dot"></span><span id="statusText">connecting…</span></div>
        <div class="mono" id="pubkey" style="margin-top: 6px"></div>
      </div>

      <div class="card">
        <div class="label">My name</div>
        <input id="name" placeholder="your name" />
      </div>

      <div class="card" style="flex: 1; display: flex; flex-direction: column; min-height: 0">
        <div class="label">Connected peers (<span id="peerCount">0</span>)</div>
        <div class="peers" id="peers"></div>
      </div>
    </aside>

    <main>
      <header>Room <small id="room"></small></header>
      <div id="messages"></div>
      <form id="form">
        <input id="input" placeholder="Write a message…" autocomplete="off" autofocus />
        <button type="submit">Send</button>
      </form>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const messagesEl = $("messages");
      let myUserId = null;

      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      function addMessage(m) {
        const mine = m.userId === myUserId;
        const el = document.createElement("div");
        el.className = "msg" + (mine ? " mine" : "");
        el.innerHTML =
          '<div class="meta">' + esc(m.name || "?") + " · " + time(m.ts) + "</div>" +
          '<div class="body">' + esc(m.body) + "</div>";
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function renderPeers(peers) {
        $("peerCount").textContent = peers.length;
        $("peers").innerHTML = peers
          .map((p) => '<div class="peer"><span class="dot"></span>' + esc(p.name || "?") + "</div>")
          .join("");
      }

      function renderStatus(s) {
        $("dot").classList.toggle("on", !!s.ready);
        $("statusText").textContent = s.ready ? "online (iroh)" : "connecting…";
        $("pubkey").textContent = s.publicKey ? s.publicKey.slice(0, 24) + "…" : "";
      }

      let ws;
      function connect() {
        ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
        ws.onmessage = (ev) => {
          const data = JSON.parse(ev.data);
          switch (data.type) {
            case "init":
              myUserId = data.identity.userId;
              $("name").value = data.identity.name;
              $("room").textContent = data.messages?.[0]?.room || "creeba-chat";
              renderStatus(data.status);
              renderPeers(data.peers || []);
              messagesEl.innerHTML = "";
              (data.messages || []).forEach(addMessage);
              break;
            case "message": addMessage(data.message); break;
            case "peers": renderPeers(data.peers); break;
            case "status": renderStatus(data.status); break;
            case "identity": $("name").value = data.identity.name; break;
          }
        };
        ws.onclose = () => {
          $("dot").classList.remove("on");
          $("statusText").textContent = "disconnected — reconnecting…";
          setTimeout(connect, 1500);
        };
      }
      connect();

      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const body = $("input").value.trim();
        if (!body || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: "send", body }));
        $("input").value = "";
      });

      let nameTimer;
      $("name").addEventListener("input", () => {
        clearTimeout(nameTimer);
        nameTimer = setTimeout(() => {
          const name = $("name").value.trim();
          if (name && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "setName", name }));
        }, 500);
      });
    </script>
  </body>
</html>
